<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f63"/>
      <stop offset="0.55" stop-color="#7a4a7c"/>
      <stop offset="1" stop-color="#e08a3c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.6" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#ff9800"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d2df"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- sun -->
  <circle cx="52" cy="46" r="17" fill="url(#sun)"/>
  <g stroke="#fba41b" stroke-width="4" stroke-linecap="round">
    <line x1="52" y1="16" x2="52" y2="22"/><line x1="52" y1="70" x2="52" y2="76"/>
    <line x1="22" y1="46" x2="28" y2="46"/><line x1="76" y1="46" x2="82" y2="46"/>
    <line x1="30.8" y1="24.8" x2="35" y2="29"/><line x1="69" y1="63" x2="73.2" y2="67.2"/>
    <line x1="73.2" y1="24.8" x2="69" y2="29"/><line x1="35" y1="63" x2="30.8" y2="67.2"/>
  </g>
  <!-- cloud -->
  <g fill="url(#cloud)">
    <circle cx="70" cy="62" r="13"/>
    <circle cx="86" cy="58" r="15"/>
    <circle cx="98" cy="66" r="11"/>
    <rect x="62" y="62" width="44" height="18" rx="9"/>
  </g>
  <!-- rain -->
  <g fill="#4fa3e8">
    <ellipse cx="74" cy="92" rx="3" ry="6"/>
    <ellipse cx="88" cy="98" rx="3" ry="6"/>
    <ellipse cx="100" cy="90" rx="3" ry="6"/>
  </g>
  <!-- glass dome outline: the "glass" homage -->
  <path d="M26 112 A52 52 0 0 1 112 38" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 112 A42 42 0 0 1 108 48" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
</svg>
